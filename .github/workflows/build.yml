name: Build JDCloud RE-CS-02 Firmware
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout build repo
        uses: actions/checkout@v5
        with:
          path: ci

      - name: Checkout ImmortalWrt (nss-edma fork)
        uses: actions/checkout@v5
        with:
          repository: mayipashu/immortalwrt-jdcloud-re-cs-02
          ref: nss-edma
          path: upstream
          fetch-depth: 1

      - name: Install system packages
        run: |
          sudo -E apt-get -yqq update
          sudo -E apt-get -yqq install ccache build-essential gcc g++ binutils patch bzip2 flex bison make autoconf gettext texinfo gawk gzip unzip zlib1g-dev libncurses5-dev libssl-dev python3 python3-distutils libgmp3-dev libmpc-dev libmpfr-dev xsltproc file wget curl rsync git subversion \
            golang-go upx-ucl nano \
            ninja-build pkg-config libcurl4-openssl-dev zlib1g-dev libseccomp-dev libcap-dev \
            protobuf-compiler protobuf-c-compiler \
            gcc-aarch64-linux-gnu \
            xz-utils zstd pigz || true
          sudo apt-get -yqq autoremove --purge 2>/dev/null || true
          sudo apt-get -yqq clean
          df -h

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/lib/jvm /usr/local/share/powershell /usr/share/swift 2>/dev/null || true
          sudo docker image prune --all --force 2>/dev/null || true

      - name: Feeds update & install
        run: |
          cd upstream
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure build (core + luci + mesh + user-selected apps)
        run: |
          cd upstream
          make defconfig
          # ---- target / device ----
          echo "CONFIG_TARGET_qualcommax=y" >> .config
          echo "CONFIG_TARGET_qualcommax_ipq60xx=y" >> .config
          echo "CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_jdcloud_re-cs-02=y" >> .config
          # ---- core tools ----
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_luci-ssl=y" >> .config
          echo "CONFIG_PACKAGE_luci-theme-bootstrap=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-firewall=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-opkg=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-ttyd=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-attendedsysupgrade=y" >> .config
          # ---- mesh ----
          echo "CONFIG_PACKAGE_luci-app-mesh=y" >> .config
          echo "CONFIG_PACKAGE_kmod-batman-adv=y" >> .config
          echo "CONFIG_PACKAGE_batctl=y" >> .config
          echo "CONFIG_PACKAGE_luci-proto-batman-adv=y" >> .config
          echo "CONFIG_PACKAGE_dawn=y" >> .config
          echo "CONFIG_PACKAGE_umdns=y" >> .config
          echo "CONFIG_PACKAGE_wpad-mesh-openssl=y" >> .config
          # ---- proxy: homeproxy ----
          echo "CONFIG_PACKAGE_luci-app-homeproxy=y" >> .config
          echo "CONFIG_PACKAGE_sing-box=y" >> .config
          # ---- tunneling / pnt ----
          echo "CONFIG_PACKAGE_lucky=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-lucky=y" >> .config
          echo "CONFIG_PACKAGE_easytier=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-easytier=y" >> .config
          echo "CONFIG_PACKAGE_tinc=y" >> .config
          echo "CONFIG_PACKAGE_frpc=y" >> .config
          echo "CONFIG_PACKAGE_n2n=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-n2n=y" >> .config
          # ---- USB + Samba ----
          echo "CONFIG_PACKAGE_kmod-usb3=y" >> .config
          echo "CONFIG_PACKAGE_kmod-usb-storage=y" >> .config
          echo "CONFIG_PACKAGE_kmod-usb-storage-uas=y" >> .config
          echo "CONFIG_PACKAGE_kmod-fs-ext4=y" >> .config
          echo "CONFIG_PACKAGE_kmod-fs-exfat=y" >> .config
          echo "CONFIG_PACKAGE_kmod-fs-ntfs3=y" >> .config
          echo "CONFIG_PACKAGE_block-mount=y" >> .config
          echo "CONFIG_PACKAGE_samba4-server=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-samba4=y" >> .config
          echo "CONFIG_PACKAGE_usbutils=y" >> .config
          # ---- watchdog ----
          echo "CONFIG_PACKAGE_watchcat=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-watchcat=y" >> .config
          make oldconfig

      - name: Show enabled packages
        run: |
          cd upstream
          echo "=== 确认 LuCI 已启用（关键：不能缺网页）==="
          grep -E "^CONFIG_PACKAGE_luci=y|^CONFIG_PACKAGE_luci-proto-batman" .config
          echo "=== 全部选中的 mesh 相关 ==="
          grep -E "luci-app-mesh|batman|dawn|umdns|wpad-mesh" .config | grep "=y"
          echo "=== 所有选中的包计数 ==="
          grep -c "=y" .config

      - name: Download packages
        run: |
          cd upstream
          make download -j8 2>&1 | tail -20 || true
          # 清理损坏的下载
          find dl -size -1024c -type f -exec rm -f {} \; 2>/dev/null || true

      - name: Build firmware
        run: |
          cd upstream
          make -j$(nproc) 2>&1 | tail -60 || { echo "=== 单线程重试(带日志) ==="; make -j1 V=s 2>&1 | tail -80; exit 1; }

      - name: Verify images
        run: |
          ls -lh upstream/bin/targets/qualcommax/ipq60xx/*.bin
          echo "=== 确认固件内含 LuCI 网页文件 ==="
          for f in upstream/bin/targets/qualcommax/ipq60xx/*sysupgrade.bin; do
            echo "固件: $f ($(stat -c%s $f) bytes)"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: upstream/bin/targets/qualcommax/ipq60xx/*.bin
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd upstream/bin/targets/qualcommax/ipq60xx
          for f in *.bin; do
            echo "发布 $f"
          done
          TAG="mesh-$(date +%Y%m%d-%H%M%S)"
          for f in *.bin; do
            gh release create "$TAG" "$f" --repo "$GITHUB_REPOSITORY" \
              --title "JDCloud RE-CS-02 Firmware ($TAG)" \
              --notes "ImmortalWrt (nss-edma) + luci-app-mesh + homeproxy + lucky + easytier + tinc + frpc + n2n + USB/samba4 + watchcat" \
              || { echo "::warning::release 上传失败，重试"; gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "JDCloud RE-CS-02 Firmware ($TAG)" >/dev/null 2>&1; gh release upload "$TAG" "$f" --repo "$GITHUB_REPOSITORY" --clobber || true; }
          done