name: Build LibWrt for JDCloud RE-CS-02

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout builder repo
        uses: actions/checkout@v4
        with:
          path: ci

      - name: Checkout LibWrt (fork, 25.12-nss)
        uses: actions/checkout@v4
        with:
          repository: mayipashu/LibWrt-jdcloud-re-cs-02
          ref: 25.12-nss
          path: libwrt
          fetch-depth: 1

      - name: Add third-party packages (lucky, easytier)
        run: |
          set -e
          mkdir -p libwrt/package/custom
          # lucky: 仓库内同时含 luci-app-lucky 与 lucky 本体
          git clone --depth 1 https://github.com/sirpdboy/luci-app-lucky /tmp/lucky
          cp -r /tmp/lucky/luci-app-lucky libwrt/package/custom/
          [ -d /tmp/lucky/lucky ] && cp -r /tmp/lucky/lucky libwrt/package/custom/
          # easytier: 仓库内同时含 luci-app-easytier 与 easytier 本体
          git clone --depth 1 https://github.com/EasyTier/luci-app-easytier /tmp/easytier
          cp -r /tmp/easytier/luci-app-easytier libwrt/package/custom/
          [ -d /tmp/easytier/easytier ] && cp -r /tmp/easytier/easytier libwrt/package/custom/
          echo "--- package/custom ---"
          ls libwrt/package/custom

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          # Ubuntu 24.04 包名适配（libncurses5-dev/python3-distutils 已移除）
          sudo apt-get install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib \
            git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses-dev libncursesw5-dev libreadline-dev libfuse-dev libssl-dev libtool lrzsz \
            genisoimage msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-setuptools \
            libpython3-dev qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim \
            wget xmlto xxd zlib1g-dev golang-go rustc cargo \
            || sudo -E apt-get install -y --fix-missing ack antlr3 asciidoc autoconf automake autopoint binutils \
               bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext \
               git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
               libmpc-dev libmpfr-dev libncurses-dev libncursesw5-dev libreadline-dev libfuse-dev libssl-dev libtool \
               lrzsz genisoimage msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip \
               python3-setuptools libpython3-dev qemu-utils rsync scons squashfs-tools subversion swig texinfo \
               upx-ucl unzip vim wget xmlto xxd zlib1g-dev golang-go
          df -h; free -h

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost /usr/lib/jvm /usr/local/share/powershell /usr/share/swift 2>/dev/null || true
          sudo docker image prune --all --force 2>/dev/null || true
          sudo swapoff -a 2>/dev/null || true
          df -h

      - name: Feeds update and install
        run: |
          cd libwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure .config
        run: |
          cd libwrt
          # ---- 第一步：先确定目标设备，再 defconfig，保证 target 默认包正确生效 ----
          rm -f .config
          cat > .config <<'EOF'
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq60xx=y
          CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_jdcloud_re-cs-02=y
          EOF
          make defconfig
          # ---- 第二步：追加功能包 ----
          cat >> .config <<'EOF'
          # ===== 802.11s Mesh 关键开关（本次修复核心）=====
          # ath11k 的 mesh offload 代码全部包在 #ifdef CPTCFG_ATH11K_NSS_MESH_SUPPORT 里，
          # 不开这个选项，驱动既不上报 mesh point，也无法注册 mesh vap。
          CONFIG_ATH11K_NSS_MESH_SUPPORT=y
          # 它 select 的三项，显式写上双保险
          CONFIG_PACKAGE_MAC80211_MESH=y
          CONFIG_NSS_FIRMWARE_VERSION_11_4=y
          CONFIG_PACKAGE_kmod-qca-nss-drv-wifi-meshmgr=y
          # ===== Mesh 组网应用 =====
          CONFIG_PACKAGE_luci-app-mesh=y
          CONFIG_PACKAGE_kmod-batman-adv=y
          CONFIG_PACKAGE_luci-proto-batman-adv=y
          CONFIG_PACKAGE_batctl-default=y
          CONFIG_PACKAGE_dawn=y
          CONFIG_PACKAGE_umdns=y
          # ===== LuCI 网页 =====
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y
          CONFIG_PACKAGE_luci-app-firewall=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_luci-app-attendedsysupgrade=y
          CONFIG_PACKAGE_uhttpd=y
          CONFIG_PACKAGE_uhttpd-mod-ubus=y
          # ===== 代理 =====
          CONFIG_PACKAGE_luci-app-homeproxy=y
          CONFIG_PACKAGE_sing-box=y
          # ===== 穿透 / 组网 =====
          CONFIG_PACKAGE_lucky=y
          CONFIG_PACKAGE_luci-app-lucky=y
          CONFIG_PACKAGE_easytier=y
          CONFIG_PACKAGE_luci-app-easytier=y
          CONFIG_PACKAGE_tinc=y
          CONFIG_PACKAGE_frpc=y
          CONFIG_PACKAGE_n2n=y
          CONFIG_PACKAGE_n2n-utils=y
          CONFIG_PACKAGE_luci-app-n2n=y
          # ===== USB + Samba =====
          CONFIG_PACKAGE_kmod-usb3=y
          CONFIG_PACKAGE_kmod-usb-storage=y
          CONFIG_PACKAGE_kmod-usb-storage-uas=y
          CONFIG_PACKAGE_kmod-fs-ext4=y
          CONFIG_PACKAGE_kmod-fs-exfat=y
          CONFIG_PACKAGE_kmod-fs-ntfs3=y
          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_samba4-server=y
          CONFIG_PACKAGE_luci-app-samba4=y
          CONFIG_PACKAGE_usbutils=y
          # ===== 断线重启 =====
          CONFIG_PACKAGE_watchcat=y
          CONFIG_PACKAGE_luci-app-watchcat=y
          EOF
          # ---- 第三步：defconfig 收口（非交互，新符号按默认值落定）----
          make defconfig

      - name: Verify config (report missing)
        run: |
          cd libwrt
          miss=0
          for p in luci luci-theme-bootstrap luci-app-firewall luci-app-ttyd \
                   luci-app-mesh kmod-batman-adv luci-proto-batman-adv dawn umdns \
                   kmod-qca-nss-drv-wifi-meshmgr \
                   luci-app-homeproxy sing-box lucky luci-app-lucky easytier luci-app-easytier \
                   tinc frpc n2n luci-app-n2n kmod-usb3 kmod-usb-storage block-mount \
                   samba4-server luci-app-samba4 usbutils watchcat luci-app-watchcat; do
            if grep -q "^CONFIG_PACKAGE_${p}=y" .config; then
              echo "OK   $p"
            else
              echo "MISS $p"; miss=$((miss+1))
            fi
          done
          echo "---- 缺失数量: $miss ----"
          echo "==== Mesh 关键开关（必须全为 =y）===="
          for c in CONFIG_ATH11K_NSS_MESH_SUPPORT CONFIG_PACKAGE_MAC80211_MESH \
                   CONFIG_NSS_FIRMWARE_VERSION_11_4 CONFIG_PACKAGE_kmod-qca-nss-drv-wifi-meshmgr; do
            if grep -q "^${c}=y" .config; then echo "OK   $c"; else echo "MISS $c"; fi
          done
          echo "==== 设备是否选中 ===="
          grep -E "DEVICE_jdcloud_re-cs-02=y|TARGET_qualcommax_ipq60xx=y" .config

      - name: Download source packages
        run: |
          cd libwrt
          make download -j8 || make download -j1 V=s
          find dl -size -1024c -type f -delete 2>/dev/null || true

      - name: Build firmware
        run: |
          cd libwrt
          make -j$(nproc) || { echo "=== 单线程重试 ==="; make -j1 V=s; }

      - name: Show images
        run: |
          ls -lh libwrt/bin/targets/qualcommax/ipq60xx/
          echo "=== NSS/Mesh 相关产物 ==="
          ls libwrt/bin/targets/qualcommax/ipq60xx/packages/ 2>/dev/null | grep -iE "meshmgr|nss-drv" || true
          for f in libwrt/bin/targets/qualcommax/ipq60xx/*.bin; do
            echo "== $f =="
            tar -tvf "$f" 2>/dev/null | head -6 || true
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libwrt-jdcloud-re-cs-02
          path: libwrt/bin/targets/qualcommax/ipq60xx/*.bin
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd libwrt/bin/targets/qualcommax/ipq60xx
          TAG="mesh-$(TZ=Asia/Shanghai date +%Y%m%d-%H%M%S)"
          NOTES=$(printf '%s\n' \
            "LibWrt 25.12-nss (kernel 6.12, NSS) for JDCloud RE-CS-02 (AX6600)." \
            "内置: luci-app-mesh (802.11s + batman-adv + dawn) / homeproxy + sing-box / lucky / easytier / tinc / frpc / n2n / USB3+samba4 / watchcat。" \
            "默认地址 192.168.1.1，密码为空。")
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "LibWrt JDCloud RE-CS-02 ($TAG)" \
            --notes "$NOTES" \
            *.bin
